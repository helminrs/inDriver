<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>inDriver</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { height: 100%; margin: 0; background-color: #121212; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 0; }
        .app-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-shell justify-between">
    <!-- Top Header inDrive Asli -->
    <header class="interactive m-3 flex justify-between items-center p-3.5 bg-[#181a1c]/95 backdrop-blur-md rounded-2xl border border-zinc-800 shadow-2xl">
        <button id="menu-btn" class="text-white text-lg p-2 focus:outline-none"><i class="fa-solid fa-bars"></i></button>
        <div class="flex items-center space-x-2 bg-black/50 px-3.5 py-1 rounded-full border border-white/10">
            <span id="role-dot" class="w-2.5 h-2.5 rounded-full bg-[#c6ff00] animate-pulse"></span>
            <span id="header-title" class="text-xs font-bold text-[#c6ff00] uppercase tracking-wider">Mode Penumpang</span>
        </div>
        <button onclick="toggleAppMode()" class="text-xs bg-[#25282a] text-[#c6ff00] font-bold px-3.5 py-1.5 rounded-xl border border-[#c6ff00]/30 shadow-md">Switch Mode</button>
    </header>

    <!-- PWA Install Banner -->
    <div id="pwa-banner" class="interactive mx-4 mb-2 hidden bg-[#181a1c] border border-[#c6ff00]/40 p-3 rounded-2xl flex justify-between items-center shadow-2xl">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-mobile-screen-button text-[#c6ff00] text-xl"></i>
            <div>
                <p class="text-xs font-bold text-white">Install inDriver PWA</p>
                <p class="text-[10px] text-zinc-400">Tampilan penuh proporsional</p>
            </div>
        </div>
        <button id="install-btn" class="bg-[#c6ff00] text-black text-xs font-bold px-3 py-1.5 rounded-xl">Install</button>
    </div>

    <!-- UI Card Bawah (Duplikasi Tampilan inDrive Asli) -->
    <div class="interactive bg-[#16181a]/95 backdrop-blur-2xl border-t border-zinc-800 rounded-t-3xl p-5 shadow-2xl max-h-[80vh] overflow-y-auto" id="ui-card">
        <!-- Konten Dinamis -->
    </div>

    <!-- Sidebar Drawer -->
    <div id="sidebar" class="interactive fixed inset-y-0 left-0 z-50 w-4/5 max-w-sm bg-[#16181a] transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl border-r border-zinc-800">
        <div class="p-6 bg-[#111315] border-b border-zinc-800 flex items-center space-x-4">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Profile" class="w-14 h-14 rounded-full object-cover border-2 border-[#c6ff00]">
            <div>
                <h3 class="font-bold text-base text-white" id="profile-name">Helmi Nurliansyah</h3>
                <p class="text-xs text-yellow-400 flex items-center mt-0.5"><i class="fa-solid fa-star mr-1"></i> <span id="profile-rating">5.00</span> (<span id="profile-trips-count">53</span> perjalanan)</p>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto py-2">
            <a href="#" onclick="alert('Saldo Dompet: Rp4.463,75')" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800/60"><i class="fa-solid fa-wallet w-8 text-[#c6ff00]"></i> Dompet (Rp4.463,75)</a>
            <a href="#" onclick="editVehicle()" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800/60"><i class="fa-solid fa-motorcycle w-8 text-[#c6ff00]"></i> Kendaraan Saya <span id="vehicle-label" class="ml-auto text-[10px] text-zinc-400">PCX HYBRID SH</span></a>
            <a href="#" onclick="openHistoryModal()" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800/60"><i class="fa-solid fa-clock-rotate-left w-8 text-[#c6ff00]"></i> Riwayat Permintaan</a>
        </div>
        <div class="p-4 border-t border-zinc-800">
            <button onclick="toggleAppMode()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-sm shadow-md">Ganti Mode Aplikasi</button>
        </div>
    </div>
    <div id="backdrop" class="interactive fixed inset-0 z-40 bg-black/60 hidden backdrop-blur-sm"></div>
</div>

<div id="map"></div>

<!-- Modal Riwayat -->
<div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-4">
    <div class="bg-[#181a1c] w-full max-w-lg rounded-3xl border border-zinc-800 p-5 max-h-[85vh] flex flex-col shadow-2xl">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-zinc-800">
            <h3 class="font-bold text-base text-white"><i class="fa-solid fa-clock-rotate-left text-[#c6ff00] mr-2"></i> Riwayat Permintaan</h3>
            <button onclick="closeHistoryModal()" class="text-zinc-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="history-list-content" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
    </div>
</div>

<script>
    // Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "https://YOUR_DATABASE-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let appMode = 'passenger'; 
    let orderState = 'idle'; // 'idle', 'searching', 'driver_offered', 'accepted', 'arrived', 'delivering'
    let driverVehicle = "Honda PCX HYBRID SH";
    let driverName = "Helmi";
    let historyTrips = JSON.parse(localStorage.getItem('indrive_history') || '[]');

    let pickupCoords = [-7.0337, 107.5833];
    let destCoords = [-7.0450, 107.6000];
    let pickupAddress = "Jl. Desa Tarajusari";
    let destAddress = "PT Weharima Langgeng Lestari";
    let currentBidPrice = 8800;

    // Inisialisasi Peta Dark Mode inDrive Asli
    const map = L.map('map', { zoomControl: false }).setView(pickupCoords, 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    // Titik GPS Penumpang & Driver
    const passengerGpsIcon = L.divIcon({
        className: 'gps-passenger',
        html: '<div style="position:relative; width:22px; height:22px;"><div style="position:absolute; width:22px; height:22px; background:rgba(59,130,246,0.3); border-radius:50%; animation: pulse 2s infinite;"></div><div style="position:absolute; top:3px; left:3px; width:16px; height:16px; background:#3b82f6; border:3px solid #fff; border-radius:50%; box-shadow:0 0 8px rgba(0,0,0,0.5);"></div></div>',
        iconSize: [22, 22], iconAnchor: [11, 11]
    });
    const driverGpsIcon = L.divIcon({
        className: 'gps-driver',
        html: '<div style="background:#c6ff00; width:18px; height:18px; border-radius:50%; border:3px solid #000; box-shadow:0 0 10px #c6ff00; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-motorcycle" style="font-size:8px; color:#000;"></i></div>',
        iconSize: [18, 18], iconAnchor: [9, 9]
    });

    L.marker([-7.0337, 107.5833], { icon: passengerGpsIcon }).addTo(map);
    L.marker([-7.0345, 107.5845], { icon: driverGpsIcon }).addTo(map);

    // Pin Jemput & Tujuan
    const pickupPinIcon = L.divIcon({
        className: 'pin-jemput-pro',
        html: '<div style="display:flex; flex-direction:column; align-items:center;"><div style="background:#ef4444; color:#fff; padding:3px 8px; border-radius:12px; font-weight:bold; font-size:10px; border:2px solid #000; box-shadow:0 4px 10px rgba(0,0,0,0.6); margin-bottom:2px; white-space:nowrap;"><i class="fa-solid fa-location-dot"></i> Jemput</div><div style="width:3px; height:12px; background:#ef4444;"></div></div>',
        iconSize: [80, 36], iconAnchor: [40, 36]
    });
    const destPinIcon = L.divIcon({
        className: 'pin-tujuan-pro',
        html: '<div style="display:flex; flex-direction:column; align-items:center;"><div style="background:#3b82f6; color:#fff; padding:3px 8px; border-radius:12px; font-weight:bold; font-size:10px; border:2px solid #000; box-shadow:0 4px 10px rgba(0,0,0,0.6); margin-bottom:2px; white-space:nowrap;"><i class="fa-solid fa-flag-checkered"></i> Tujuan</div><div style="width:3px; height:12px; background:#3b82f6;"></div></div>',
        iconSize: [80, 36], iconAnchor: [40, 36]
    });

    const pickupMarker = L.marker(pickupCoords, { icon: pickupPinIcon, draggable: true }).addTo(map);
    const destMarker = L.marker(destCoords, { icon: destPinIcon, draggable: true }).addTo(map);
    let routePolyline = L.polyline([], { color: '#c6ff00', weight: 4, opacity: 0.85 }).addTo(map);

    // OSRM Routing Engine (Jalur Mobil)
    async function fetchRealRoute() {
        const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords[1]},${pickupCoords[0]};${destCoords[1]},${destCoords[0]}?overview=full&geometries=geojson`;
        try {
            let res = await fetch(url);
            let data = await res.json();
            if (data.routes && data.routes.length > 0) {
                let coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                routePolyline.setLatLngs(coords);
            }
        } catch(e) {
            routePolyline.setLatLngs([pickupCoords, destCoords]);
        }
        updateUI();
    }

    pickupMarker.on('dragend', (e) => { pickupCoords = [e.target.getLatLng().lat, e.target.getLatLng().lng]; fetchRealRoute(); });
    destMarker.on('dragend', (e) => { destCoords = [e.target.getLatLng().lat, e.target.getLatLng().lng]; fetchRealRoute(); });

    function changePrice(amount) {
        currentBidPrice += amount;
        if (currentBidPrice < 5000) currentBidPrice = 5000;
        updateUI();
    }

    function triggerVibration(type) {
        if ("vibrate" in navigator) {
            if (type === 'near') navigator.vibrate([400, 100, 400]);
            else if (type === 'accept' || type === 'arrived') navigator.vibrate([600]);
        }
    }

    // Render Tampilan inDrive Asli & Alur Bidding Presisi
    function updateUI() {
        const card = document.getElementById('ui-card');
        const title = document.getElementById('header-title');

        document.getElementById('profile-trips-count').innerText = historyTrips.length + 53;
        document.getElementById('vehicle-label').innerText = driverVehicle;

        if (appMode === 'passenger') {
            title.innerText = "Mode Penumpang";
            if (orderState === 'idle') {
                card.innerHTML = `
                    <div class="space-y-3">
                        <!-- Layanan Kendaraan inDrive -->
                        <div class="flex space-x-2 overflow-x-auto pb-1">
                            <div class="bg-[#212325] border border-[#c6ff00] px-3 py-2 rounded-xl flex items-center space-x-2"><i class="fa-solid fa-motorcycle text-[#c6ff00]"></i><span class="text-xs font-bold text-white">inMotor</span></div>
                            <div class="bg-[#212325] px-3 py-2 rounded-xl flex items-center space-x-2 text-zinc-400"><i class="fa-solid fa-car"></i><span class="text-xs">inMobil</span></div>
                            <div class="bg-[#212325] px-3 py-2 rounded-xl flex items-center space-x-2 text-zinc-400"><i class="fa-solid fa-box"></i><span class="text-xs">Kurir</span></div>
                        </div>
                        <!-- Input Rute -->
                        <div class="bg-[#212325] p-3 rounded-xl border border-zinc-800 space-y-2">
                            <div class="flex items-center text-xs text-zinc-300"><i class="fa-solid fa-circle-dot text-[#c6ff00] mr-2"></i> <b>Dari:</b> ${pickupAddress}</div>
                            <div class="flex items-center text-xs text-zinc-300"><i class="fa-solid fa-location-dot text-red-500 mr-2"></i> <b>Ke:</b> ${destAddress}</div>
                        </div>
                        <!-- Penyesuaian Harga inDrive (+ / -) -->
                        <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 text-center space-y-2">
                            <p class="text-xs text-zinc-400">Tarif yang direkomendasikan</p>
                            <div class="flex items-center justify-center space-x-4">
                                <button onclick="changePrice(-1000)" class="w-10 h-10 bg-[#2b2e31] text-white font-bold rounded-full text-lg">-</button>
                                <span class="text-2xl font-black text-white">Rp ${currentBidPrice.toLocaleString('id-ID')}</span>
                                <button onclick="changePrice(1000)" class="w-10 h-10 bg-[#2b2e31] text-white font-bold rounded-full text-lg">+</button>
                            </div>
                        </div>
                        <button onclick="passengerPublishOrder()" class="w-full bg-[#c6ff00] text-black font-bold py-3.5 rounded-2xl text-sm shadow-xl">Cari tawaran</button>
                    </div>`;
            } else if (orderState === 'searching') {
                card.innerHTML = `
                    <div class="space-y-4 text-center py-4">
                        <p class="text-xs text-zinc-400">Tarif yang bagus. Permintaan Anda jadi prioritas</p>
                        <h3 class="text-xl font-black text-white">Rp ${currentBidPrice.toLocaleString('id-ID')}</h3>
                        <p class="text-xs text-[#c6ff00] animate-pulse"><i class="fa-solid fa-radar mr-1"></i> 1 pengemudi sedang melihat permintaan Anda...</p>
                    </div>`;
            } else if (orderState === 'driver_offered') {
                // Tampilan Halaman "Pilih Pengemudi" Persis Screenshot 1000060870.jpg
                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-sm text-white">Pilih pengemudi</h4>
                            <button onclick="passengerCancelOrder()" class="text-xs text-red-400 font-bold">Batalkan</button>
                        </div>
                        <p class="text-[10px] text-zinc-400"><i class="fa-solid fa-shield-halved text-[#c6ff00]"></i> Semua driver terverifikasi</p>
                        <!-- Card Driver Menawar -->
                        <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-700 space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-bold text-white">Rp ${currentBidPrice.toLocaleString('id-ID')} <span class="text-xs text-zinc-400 font-normal">1 mnt</span></span>
                                <span class="bg-[#c6ff00]/20 text-[#c6ff00] text-[10px] px-2 py-0.5 rounded font-bold"><i class="fa-solid fa-check"></i> Tarif Anda</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-12 h-12 rounded-full object-cover border border-[#c6ff00]">
                                <div>
                                    <h5 class="font-bold text-sm text-white">${driverName.toUpperCase()} <span class="text-xs text-yellow-400"><i class="fa-solid fa-star"></i> 5</span> <span class="text-xs text-zinc-400 font-normal">53 perjalanan</span></h5>
                                    <p class="text-xs text-zinc-300">${driverVehicle}</p>
                                </div>
                            </div>
                            <div class="flex space-x-2 pt-2">
                                <button onclick="alert('Penawaran ditolak')" class="flex-1 bg-[#2b2e31] text-zinc-300 font-bold py-2.5 rounded-xl text-xs">Tolak</button>
                                <button onclick="passengerSelectDriver()" class="flex-1 bg-[#c6ff00] text-black font-bold py-2.5 rounded-xl text-xs shadow-lg">Terima</button>
                            </div>
                        </div>
                    </div>`;
            } else {
                card.innerHTML = `<div class="bg-[#212325] p-4 rounded-xl border border-zinc-800 text-center space-y-2"><p class="text-xs text-[#c6ff00] font-bold">Perjalanan Aktif Bersama Driver</p><p class="text-xs text-zinc-300">${driverVehicle}</p></div>`;
            }
        } else {
            // Mode Pengemudi (Online)
            title.innerText = "Mode Pengemudi (Online)";
            
            db.ref('active_orders').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || data.status === 'idle') {
                    if (orderState === 'idle') {
                        card.innerHTML = `
                            <div class="space-y-3">
                                <div class="bg-[#212325] p-3 rounded-xl flex justify-between items-center border border-zinc-800">
                                    <span class="text-xs text-zinc-300">Saldo kurang. Tambah dana</span>
                                    <i class="fa-solid fa-chevron-right text-xs text-zinc-500"></i>
                                </div>
                                <div class="text-center py-6">
                                    <i class="fa-solid fa-radar animate-spin text-[#c6ff00] text-2xl mb-2"></i>
                                    <p class="text-xs text-zinc-400">Mencari order di sekitar...</p>
                                </div>
                            </div>`;
                    }
                    return;
                }

                if (data.status === 'searching' && orderState === 'idle') {
                    triggerVibration('near');
                    card.innerHTML = `
                        <div class="space-y-3">
                            <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-700 space-y-3">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-sm text-white">~10 m</h4>
                                    <span class="text-sm font-bold text-[#c6ff00]">Rp ${data.price.toLocaleString('id-ID')}</span>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-white">${pickupAddress}</p>
                                    <p class="text-[10px] text-zinc-400">${destAddress}</p>
                                </div>
                                <button onclick="driverSendOffer()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs shadow-lg">Kirim Tawaran / Terima Order</button>
                            </div>
                        </div>`;
                }
            });

            if (orderState === 'driver_offered') {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 space-y-3 text-center">
                        <i class="fa-solid fa-spinner animate-spin text-[#c6ff00] text-xl"></i>
                        <h4 class="font-bold text-xs text-white">Sedang menawarkan ongkos Anda Rp ${currentBidPrice.toLocaleString('id-ID')}</h4>
                        <p class="text-[10px] text-zinc-400">Tunggu balasannya dari penumpang...</p>
                    </div>`;
            } else if (orderState === 'accepted') {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 space-y-3">
                        <h4 class="font-bold text-sm text-[#c6ff00]"><i class="fa-solid fa-route mr-1"></i> Menuju Titik Jemput</h4>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${pickupCoords[0]},${pickupCoords[1]}&travelmode=driving" target="_blank" class="block w-full text-center bg-blue-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg"><i class="fa-solid fa-location-arrow mr-1"></i> Navigasi Google Maps (Rute Motor)</a>
                        <button onclick="driverArrived()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs shadow-lg">Saya Sudah Tiba di Titik Jemput</button>
                    </div>`;
            } else if (orderState === 'arrived') {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 space-y-3 text-center">
                        <p class="text-xs text-yellow-400 font-bold"><i class="fa-solid fa-bell"></i> Notifikasi & getaran panjang terkirim ke penumpang!</p>
                        <button onclick="driverStartDelivering()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs shadow-lg">Mulai Perjalanan ke Tujuan</button>
                    </div>`;
            } else if (orderState === 'delivering') {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 space-y-3">
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${destCoords[0]},${destCoords[1]}&travelmode=driving" target="_blank" class="block w-full text-center bg-blue-600 text-white font-bold py-3 rounded-xl text-xs shadow-lg"><i class="fa-solid fa-location-arrow mr-1"></i> Navigasi ke Titik Tujuan</a>
                        <button onclick="driverFinishOrder()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs shadow-lg">Perjalanan Selesai</button>
                    </div>`;
            }
        }
    }

    // Aksi Alur Transaksi InDrive Asli
    function passengerPublishOrder() {
        db.ref('active_orders').set({
            id: 'ord_' + Date.now(),
            price: currentBidPrice,
            pickup: pickupCoords,
            destination: destCoords,
            status: 'searching'
        });
        orderState = 'searching';
        updateUI();
    }

    function driverSendOffer() {
        triggerVibration('accept');
        orderState = 'driver_offered';
        db.ref('active_orders/status').set('driver_offered');
        updateUI();
        // Otomatis ubah status di penumpang setelah driver mengirim penawaran
        setTimeout(() => {
            if(appMode === 'passenger') {
                orderState = 'driver_offered';
                updateUI();
            }
        }, 1500);
    }

    function passengerSelectDriver() {
        triggerVibration('accept');
        orderState = 'accepted';
        db.ref('active_orders/status').set('accepted');
        updateUI();
    }

    function driverArrived() {
        triggerVibration('arrived');
        orderState = 'arrived';
        alert("Notifikasi & getaran panjang terkirim ke penumpang: Driver Tiba di Jemput!");
        updateUI();
    }

    function driverStartDelivering() {
        orderState = 'delivering';
        updateUI();
    }

    function driverFinishOrder() {
        triggerVibration('accept');
        const nowTime = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        const newTrip = {
            id: 'TRIP-' + Math.floor(1000 + Math.random() * 9000),
            date: nowTime,
            service: 'inMotor - Perjalanan Kota',
            vehicle: driverVehicle,
            fare: currentBidPrice,
            route: `${pickupAddress} -> ${destAddress}`
        };
        historyTrips.unshift(newTrip);
        localStorage.setItem('indrive_history', JSON.stringify(historyTrips));

        db.ref('active_orders').remove();
        orderState = 'idle';
        updateUI();
        alert("Perjalanan Selesai! Rincian pendapatan tersimpan di riwayat.");
    }

    function passengerCancelOrder() {
        db.ref('active_orders').remove();
        orderState = 'idle';
        updateUI();
    }

    function openHistoryModal() {
        const listContent = document.getElementById('history-list-content');
        listContent.innerHTML = '';
        if (historyTrips.length === 0) {
            listContent.innerHTML = `<p class="text-xs text-zinc-500 text-center py-6">Tidak ada order yang telah diselesaikan.</p>`;
        } else {
            historyTrips.forEach(trip => {
                listContent.innerHTML += `
                    <div class="bg-[#121416] p-3.5 rounded-2xl border border-zinc-800 space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xs text-white">${trip.service}</span>
                            <span class="font-bold text-xs text-[#c6ff00]">Rp ${trip.fare.toLocaleString('id-ID')}</span>
                        </div>
                        <p class="text-[10px] text-zinc-400"><i class="fa-solid fa-clock mr-1"></i> ${trip.date}</p>
                        <p class="text-[10px] text-zinc-300"><i class="fa-solid fa-route mr-1"></i> ${trip.route}</p>
                        <p class="text-[10px] text-zinc-500">Kendaraan: ${trip.vehicle}</p>
                    </div>`;
            });
        }
        document.getElementById('history-modal').classList.remove('hidden');
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('backdrop').classList.add('hidden');
    }

    function closeHistoryModal() {
        document.getElementById('history-modal').classList.add('hidden');
    }

    function editVehicle() {
        const newV = prompt("Edit Kendaraan Anda:", driverVehicle);
        if (newV) { driverVehicle = newV; updateUI(); alert("Kendaraan diperbarui!"); }
    }

    function toggleAppMode() {
        appMode = appMode === 'driver' ? 'passenger' : 'driver';
        orderState = 'idle';
        updateUI();
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('backdrop').classList.add('hidden');
    }

    document.getElementById('menu-btn').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('-translate-x-full');
        document.getElementById('backdrop').classList.remove('hidden');
    });
    document.getElementById('backdrop').addEventListener('click', () => {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('backdrop').classList.add('hidden');
    });

    fetchRealRoute();
</script>
</body>
</html>
