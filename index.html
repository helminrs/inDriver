<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>inDriver - Driver & Passenger Mode</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { height: 100%; margin: 0; background-color: #121212; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 0; }
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; overflow: hidden; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Header Bar -->
    <header class="absolute top-0 left-0 right-0 z-20 flex justify-between items-center p-4 bg-gradient-to-b from-black/80 to-transparent">
        <button id="menu-btn" class="text-white text-xl p-2 focus:outline-none">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="flex items-center space-x-2 bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10">
            <span id="status-indicator" class="w-3 h-3 rounded-full bg-lime-400 animate-pulse"></span>
            <span id="status-text" class="text-sm font-semibold text-white">Online</span>
        </div>
        <button id="settings-btn" class="text-white text-xl p-2 focus:outline-none">
            <i class="fa-solid fa-gear"></i>
        </button>
    </header>

    <!-- Main Map Container -->
    <div id="map"></div>

    <!-- PWA Install Banner / Button (Hidden when installed) -->
    <div id="pwa-install-container" class="absolute top-20 left-4 right-4 z-20 hidden">
        <div class="bg-zinc-900/90 border border-lime-400/30 p-3 rounded-xl flex justify-between items-center shadow-lg backdrop-blur-md">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-mobile-screen-button text-lime-400 text-2xl"></i>
                <div>
                    <p class="text-xs font-bold text-white">Install Aplikasi inDriver</p>
                    <p class="text-[10px] text-zinc-400">Akses cepat & performa maksimal di HP Anda</p>
                </div>
            </div>
            <button id="install-pwa-btn" class="bg-lime-400 text-black text-xs font-bold px-3 py-1.5 rounded-lg">Install</button>
        </div>
    </div>

    <!-- Dynamic Driver / Passenger Card Overlay -->
    <div id="ui-overlay" class="absolute bottom-0 left-0 right-0 z-20 bg-zinc-900/95 backdrop-blur-xl border-t border-zinc-800 rounded-t-3xl p-5 shadow-2xl transition-all duration-300">
        <!-- Konten Dinamis Diisi Script -->
    </div>

    <!-- Bottom Navigation Bar (Ala InDrive Asli) -->
    <nav class="absolute bottom-0 left-0 right-0 z-30 bg-black/90 border-t border-zinc-800 flex justify-around py-3 px-6">
        <button onclick="switchTab('order')" class="flex flex-col items-center text-zinc-400 hover:text-lime-400 transition-colors" id="nav-order">
            <i class="fa-solid fa-list text-lg mb-1"></i>
            <span class="text-[10px] font-medium">Permintaan transportasi</span>
        </button>
        <button onclick="switchTab('performance')" class="flex flex-col items-center text-zinc-400 hover:text-lime-400 transition-colors" id="nav-performance">
            <i class="fa-solid fa-table-cells-large text-lg mb-1"></i>
            <span class="text-[10px] font-medium">Performa</span>
        </button>
    </nav>

    <!-- Slide-out Sidebar Drawer -->
    <div id="sidebar-drawer" class="fixed inset-y-0 left-0 z-50 w-4/5 max-w-sm bg-zinc-900 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl border-r border-zinc-800">
        <div class="p-6 bg-zinc-950 border-b border-zinc-800 flex items-center space-x-4">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Profile" class="w-14 h-14 rounded-full object-cover border-2 border-lime-400">
            <div>
                <h3 class="font-bold text-base text-white">Helmi Nurliansyah</h3>
                <p class="text-xs text-yellow-400 flex items-center mt-0.5"><i class="fa-solid fa-star mr-1"></i> 5.00 (21)</p>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto py-2">
            <a href="#" onclick="openMenuPage('dompet')" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800"><i class="fa-solid fa-wallet w-8 text-lime-400"></i> Dompet (Rp4.463,75)</a>
            <a href="#" onclick="openMenuPage('kendaraan')" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800"><i class="fa-solid fa-motorcycle w-8 text-lime-400"></i> Kendaraan Saya</a>
            <a href="#" onclick="openMenuPage('riwayat')" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800"><i class="fa-solid fa-clock-rotate-left w-8 text-lime-400"></i> Riwayat Permintaan</a>
            <a href="#" onclick="openMenuPage('pengaturan')" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800"><i class="fa-solid fa-gear w-8 text-lime-400"></i> Pengaturan Suara & Getar</a>
            <a href="#" onclick="openMenuPage('bantuan')" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800"><i class="fa-solid fa-circle-question w-8 text-lime-400"></i> Bantuan & Dukungan</a>
        </div>
        <div class="p-4 border-t border-zinc-800">
            <button id="toggle-mode-btn" class="w-full bg-lime-400 text-black font-bold py-3 rounded-xl text-sm shadow-md">Mode Penumpang</button>
        </div>
    </div>
    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-black/60 hidden backdrop-blur-sm"></div>
</div>

<script>
    // Inisialisasi Peta Leaflet Fullscreen
    const map = L.map('map', { zoomControl: false }).setView([-7.0337, 107.5833], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
    }).addTo(map);

    // Ikon Titik Driver Aktif & Penumpang
    const driverIcon = L.divIcon({
        className: 'custom-driver-icon',
        html: '<div style="background: #a3e635; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #000; box-shadow: 0 0 10px #a3e635;"></div>',
        iconSize: [16, 16]
    });
    L.marker([-7.0337, 107.5833], { icon: driverIcon }).addTo(map).bindPopup("Driver Aktif: Helmi");

    // Logika Getaran & Suara Bervariasi
    function triggerFeedback(type) {
        if ("vibrate" in navigator) {
            if (type === 'near-order') navigator.vibrate([400, 100, 400]); // Getaran panjang ganda untuk order <=2km
            else if (type === 'missed') navigator.vibrate(100); // Pendek saat terlewat
            else if (type === 'accepted' || type === 'arrived') navigator.vibrate([600]); // Getaran panjang tunggal
        }
        // Audio Notifikasi Web Audio API
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = type === 'near-order' ? 880 : 440;
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } catch(e) {}
    }

    // PWA Installation Prompt Logic
    let deferredPrompt;
    const installContainer = document.getElementById('pwa-install-container');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installContainer.classList.remove('hidden');
    });
    document.getElementById('install-pwa-btn').addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installContainer.classList.add('hidden');
            }
            deferredPrompt = null;
        }
    });
    window.addEventListener('appinstalled', () => {
        installContainer.classList.add('hidden');
    });

    // Sidebar Drawer Toggle
    const drawer = document.getElementById('sidebar-drawer');
    const backdrop = document.getElementById('sidebar-backdrop');
    document.getElementById('menu-btn').addEventListener('click', () => {
        drawer.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
    });
    backdrop.addEventListener('click', () => {
        drawer.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
    });

    // Tab Navigasi Bawah
    function switchTab(tab) {
        const overlay = document.getElementById('ui-overlay');
        if(tab === 'order') {
            overlay.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Menunggu Pesanan Real-time</span>
                    <span class="text-xs text-lime-400 font-semibold"><i class="fa-solid fa-radar animate-spin mr-1"></i> Radar Aktif</span>
                </div>
                <div class="bg-zinc-800/60 p-4 rounded-2xl border border-zinc-700/50 mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h4 class="font-bold text-sm text-white">inMotor - Perjalanan Dalam Kota</h4>
                            <p class="text-xs text-zinc-400">Radius &lt; 3 km (Pop-up Terdekat)</p>
                        </div>
                        <span class="bg-lime-400/20 text-lime-400 text-xs px-2.5 py-1 rounded-full font-bold">Rp 12.574</span>
                    </div>
                    <div class="flex space-x-2 mt-4">
                        <button onclick="acceptOrder()" class="flex-1 bg-lime-400 text-black font-bold py-2.5 rounded-xl text-xs">Terima Tawaran</button>
                        <button onclick="triggerFeedback('missed')" class="bg-zinc-700 text-zinc-300 px-4 py-2.5 rounded-xl text-xs">Abaikan</button>
                    </div>
                </div>`;
            triggerFeedback('near-order');
        } else if(tab === 'performance') {
            overlay.innerHTML = `
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-zinc-400 font-medium">Prioritas Driver</span>
                        <span class="text-xs font-bold text-lime-400 bg-lime-400/10 px-2.5 py-1 rounded-md">Rendah</span>
                    </div>
                    <div class="bg-zinc-800/50 p-4 rounded-2xl border border-zinc-700/50 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-zinc-400">Pendapatan Hari Ini</p>
                            <h3 class="text-xl font-black text-white mt-0.5">Rp 0</h3>
                        </div>
                        <button class="bg-zinc-700 text-white text-xs px-3 py-2 rounded-xl font-medium">Target Harian</button>
                    </div>
                    <div class="flex justify-between items-center px-1">
                        <span class="text-xs text-zinc-300">Saldo Dompet</span>
                        <span class="text-xs font-bold text-lime-400">Rp 4.463,75</span>
                    </div>
                </div>`;
        }
    }

    function acceptOrder() {
        triggerFeedback('accepted');
        const overlay = document.getElementById('ui-overlay');
        overlay.innerHTML = `
            <div class="animate-pulse mb-3 text-center">
                <p class="text-xs text-yellow-400 font-bold"><i class="fa-solid fa-spinner animate-spin mr-1"></i> Menunggu penumpang memilih inDriver...</p>
            </div>
            <div class="bg-zinc-800/80 p-4 rounded-2xl border border-zinc-700">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-lime-400 text-black font-bold flex items-center justify-center">H</div>
                        <div>
                            <h4 class="font-bold text-sm text-white">Helmi (Penumpang)</h4>
                            <p class="text-[10px] text-zinc-400"><i class="fa-solid fa-star text-yellow-400"></i> 5.0</p>
                        </div>
                    </div>
                    <button onclick="arrivedAtPickup()" class="bg-lime-400 text-black text-xs font-bold px-4 py-2.5 rounded-xl shadow-lg">Saya di Sini</button>
                </div>
            </div>`;
    }

    function arrivedAtPickup() {
        triggerFeedback('arrived');
        alert("Notifikasi & Getaran panjang terkirim ke tab penumpang: Driver Telah Tiba di Titik Jemput!");
        const overlay = document.getElementById('ui-overlay');
        overlay.innerHTML = `
            <div class="bg-zinc-800/80 p-4 rounded-2xl border border-zinc-700 text-center">
                <h4 class="font-bold text-sm text-lime-400 mb-1"><i class="fa-solid fa-circle-check"></i> Menuju Titik Antar</h4>
                <p class="text-xs text-zinc-400 mb-4">Navigasi aktif menuju lokasi tujuan.</p>
                <button onclick="finishOrder()" class="w-full bg-lime-400 text-black font-bold py-3 rounded-xl text-xs">Orderan Selesai</button>
            </div>`;
    }

    function finishOrder() {
        alert("Orderan Selesai! Data & waktu detail tersimpan di Riwayat Permintaan.");
        switchTab('order');
    }

    function openMenuPage(page) {
        alert("Membuka halaman menu: " + page.toUpperCase() + " (Terintegrasi sesuai sistem inDriver asli)");
        drawer.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
    }

    // Default load tab order
    switchTab('order');
</script>
</body>
</html>
