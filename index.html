<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>inDriver</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { height: 100%; margin: 0; background-color: #121212; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 0; }
        .app-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-shell justify-between">
    <!-- Header inDrive Asli -->
    <header class="interactive m-3 flex justify-between items-center p-3.5 bg-[#181a1c]/95 backdrop-blur-md rounded-2xl border border-zinc-800 shadow-2xl">
        <button id="menu-btn" class="text-white text-lg p-2 focus:outline-none"><i class="fa-solid fa-bars"></i></button>
        <div class="flex items-center space-x-2 bg-black/50 px-3 py-1 rounded-full border border-white/10">
            <span id="role-dot" class="w-2.5 h-2.5 rounded-full bg-[#c6ff00] animate-pulse"></span>
            <span id="header-title" class="text-xs font-bold text-[#c6ff00] uppercase tracking-wider">Memuat...</span>
        </div>
        <div class="flex space-x-1">
            <button onclick="switchRole('passenger')" id="btn-p" class="text-[10px] bg-zinc-700 text-zinc-300 font-bold px-2.5 py-1.5 rounded-lg shadow">Penumpang</button>
            <button onclick="switchRole('driver')" id="btn-d" class="text-[10px] bg-zinc-700 text-zinc-300 font-bold px-2.5 py-1.5 rounded-lg shadow">Driver</button>
        </div>
    </header>

    <!-- UI Card Bawah -->
    <div class="interactive bg-[#16181a]/95 backdrop-blur-2xl border-t border-zinc-800 rounded-t-3xl p-5 shadow-2xl max-h-[80vh] overflow-y-auto" id="ui-card">
        <!-- Konten Dinamis -->
    </div>

    <!-- Sidebar Drawer -->
    <div id="sidebar" class="interactive fixed inset-y-0 left-0 z-50 w-4/5 max-w-sm bg-[#16181a] transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl border-r border-zinc-800">
        <div class="p-6 bg-[#111315] border-b border-zinc-800 flex items-center space-x-4">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Profile" class="w-14 h-14 rounded-full object-cover border-2 border-[#c6ff00]">
            <div>
                <h3 class="font-bold text-base text-white">Helmi Nurliansyah</h3>
                <p class="text-xs text-yellow-400 flex items-center mt-0.5"><i class="fa-solid fa-star mr-1"></i> 5.00 (53 perjalanan)</p>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto py-2">
            <a href="#" onclick="alert('Saldo Dompet: Rp4.463,75')" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800/60"><i class="fa-solid fa-wallet w-8 text-[#c6ff00]"></i> Dompet (Rp4.463,75)</a>
            <a href="#" onclick="openHistoryModal()" class="flex items-center px-6 py-3.5 text-sm text-zinc-200 hover:bg-zinc-800/60"><i class="fa-solid fa-clock-rotate-left w-8 text-[#c6ff00]"></i> Riwayat Permintaan</a>
        </div>
    </div>
    <div id="backdrop" class="interactive fixed inset-0 z-40 bg-black/60 hidden backdrop-blur-sm"></div>
</div>

<div id="map"></div>

<!-- Modal Riwayat -->
<div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-4">
    <div class="bg-[#181a1c] w-full max-w-lg rounded-3xl border border-zinc-800 p-5 max-h-[85vh] flex flex-col shadow-2xl">
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-zinc-800">
            <h3 class="font-bold text-base text-white"><i class="fa-solid fa-clock-rotate-left text-[#c6ff00] mr-2"></i> Riwayat Permintaan</h3>
            <button onclick="document.getElementById('history-modal').classList.add('hidden')" class="text-zinc-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="history-list-content" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "https://YOUR_DATABASE-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Deteksi Role otomatis dari URL (?role=driver atau ?role=passenger)
    const urlParams = new URLSearchParams(window.location.search);
    let myRole = urlParams.get('role');
    if (!myRole) {
        myRole = 'passenger';
        // Auto set URL parameter agar tab langsung aktif sebagai penumpang secara default
        window.history.replaceState({}, '', '?role=passenger');
    }

    let currentBidPrice = 8800;
    let pickupCoords = [-7.0337, 107.5833];
    let destCoords = [-7.0450, 107.6000];
    let pickupAddress = "Jl. Desa Tarajusari";
    let destAddress = "PT Weharima Langgeng Lestari";
    let historyTrips = JSON.parse(localStorage.getItem('indrive_history') || '[]');

    const map = L.map('map', { zoomControl: false }).setView(pickupCoords, 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    const pickupPinIcon = L.divIcon({
        className: 'pin-j',
        html: '<div style="background:#ef4444; color:#fff; padding:3px 8px; border-radius:12px; font-weight:bold; font-size:10px; border:2px solid #000;">Jemput</div>',
        iconSize: [60, 26], iconAnchor: [30, 26]
    });
    const destPinIcon = L.divIcon({
        className: 'pin-t',
        html: '<div style="background:#3b82f6; color:#fff; padding:3px 8px; border-radius:12px; font-weight:bold; font-size:10px; border:2px solid #000;">Tujuan</div>',
        iconSize: [60, 26], iconAnchor: [30, 26]
    });

    L.marker(pickupCoords, { icon: pickupPinIcon }).addTo(map);
    L.marker(destCoords, { icon: destPinIcon }).addTo(map);
    let routePolyline = L.polyline([], { color: '#c6ff00', weight: 4, opacity: 0.85 }).addTo(map);

    async function fetchRealRoute() {
        const url = `https://router.project-osrm.org/route/v1/driving/${pickupCoords[1]},${pickupCoords[0]};${destCoords[1]},${destCoords[0]}?overview=full&geometries=geojson`;
        try {
            let res = await fetch(url);
            let data = await res.json();
            if (data.routes && data.routes.length > 0) {
                routePolyline.setLatLngs(data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]));
            }
        } catch(e) {
            routePolyline.setLatLngs([pickupCoords, destCoords]);
        }
    }
    fetchRealRoute();

    function switchRole(role) {
        window.location.href = `?role=${role}`;
    }

    function updateRoleButtons() {
        const bp = document.getElementById('btn-p');
        const bd = document.getElementById('btn-d');
        if (myRole === 'passenger') {
            bp.className = "text-[10px] bg-blue-600 text-white font-bold px-2.5 py-1.5 rounded-lg shadow";
            bd.className = "text-[10px] bg-zinc-700 text-zinc-300 font-bold px-2.5 py-1.5 rounded-lg shadow";
        } else {
            bd.className = "text-[10px] bg-emerald-600 text-white font-bold px-2.5 py-1.5 rounded-lg shadow";
            bp.className = "text-[10px] bg-zinc-700 text-zinc-300 font-bold px-2.5 py-1.5 rounded-lg shadow";
        }
    }

    function changePrice(amount) {
        currentBidPrice += amount;
        if (currentBidPrice < 5000) currentBidPrice = 5000;
        db.ref('active_order/price').set(currentBidPrice);
    }

    function triggerVibration(type) {
        if ("vibrate" in navigator) {
            if (type === 'near') navigator.vibrate([400, 100, 400]);
            else navigator.vibrate([600]);
        }
    }

    db.ref('active_order').on('value', (snapshot) => {
        updateUI(snapshot.val());
    });

    function updateUI(order = null) {
        updateRoleButtons();
        const card = document.getElementById('ui-card');
        const title = document.getElementById('header-title');

        if (myRole === 'passenger') {
            title.innerText = "Mode Penumpang";
            if (!order || order.status === 'idle') {
                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex space-x-2 overflow-x-auto pb-1">
                            <div class="bg-[#212325] border border-[#c6ff00] px-3 py-2 rounded-xl flex items-center space-x-2"><i class="fa-solid fa-motorcycle text-[#c6ff00]"></i><span class="text-xs font-bold text-white">inMotor</span></div>
                            <div class="bg-[#212325] px-3 py-2 rounded-xl flex items-center space-x-2 text-zinc-400"><i class="fa-solid fa-car"></i><span class="text-xs">inMobil</span></div>
                        </div>
                        <div class="bg-[#212325] p-3 rounded-xl border border-zinc-800 space-y-1 text-xs">
                            <div class="text-zinc-300"><i class="fa-solid fa-circle-dot text-[#c6ff00] mr-2"></i> <b>Dari:</b> ${pickupAddress}</div>
                            <div class="text-zinc-300"><i class="fa-solid fa-location-dot text-red-500 mr-2"></i> <b>Ke:</b> ${destAddress}</div>
                        </div>
                        <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 text-center space-y-2">
                            <p class="text-xs text-zinc-400">Tarif yang direkomendasikan</p>
                            <div class="flex items-center justify-center space-x-4">
                                <button onclick="changePrice(-1000)" class="w-10 h-10 bg-[#2b2e31] text-white font-bold rounded-full text-lg">-</button>
                                <span class="text-2xl font-black text-white">Rp ${(order ? order.price : currentBidPrice).toLocaleString('id-ID')}</span>
                                <button onclick="changePrice(1000)" class="w-10 h-10 bg-[#2b2e31] text-white font-bold rounded-full text-lg">+</button>
                            </div>
                        </div>
                        <button onclick="passengerPublishOrder()" class="w-full bg-[#c6ff00] text-black font-bold py-3.5 rounded-2xl text-sm shadow-xl">Cari tawaran</button>
                    </div>`;
            } else if (order.status === 'searching') {
                card.innerHTML = `
                    <div class="space-y-4 text-center py-4">
                        <p class="text-xs text-zinc-400">Permintaan Anda disiarkan ke driver...</p>
                        <h3 class="text-xl font-black text-white">Rp ${order.price.toLocaleString('id-ID')}</h3>
                        <p class="text-xs text-[#c6ff00] animate-pulse"><i class="fa-solid fa-radar mr-1"></i> Mencari pengemudi terdekat...</p>
                        <button onclick="cancelOrder()" class="bg-red-500/20 text-red-400 text-xs font-bold px-4 py-2 rounded-xl mt-2">Batalkan Permintaan</button>
                    </div>`;
            } else if (order.status === 'driver_offered') {
                card.innerHTML = `
                    <div class="space-y-3">
                        <h4 class="font-bold text-sm text-white">Pilih pengemudi</h4>
                        <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-700 space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-bold text-white">Rp ${order.price.toLocaleString('id-ID')} <span class="text-xs text-zinc-400">1 mnt</span></span>
                                <span class="bg-[#c6ff00]/20 text-[#c6ff00] text-[10px] px-2 py-0.5 rounded font-bold">Tarif Anda</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-12 h-12 rounded-full object-cover border border-[#c6ff00]">
                                <div>
                                    <h5 class="font-bold text-sm text-white">HELMI <span class="text-xs text-yellow-400"><i class="fa-solid fa-star"></i> 5</span></h5>
                                    <p class="text-xs text-zinc-300">Honda PCX HYBRID SH</p>
                                </div>
                            </div>
                            <button onclick="passengerAcceptDriver()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs shadow-lg">Terima Driver Ini</button>
                        </div>
                    </div>`;
            } else if (['accepted', 'arrived', 'delivering'].includes(order.status)) {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-xl border border-zinc-800 text-center space-y-2">
                        <p class="text-xs text-[#c6ff00] font-bold"><i class="fa-solid fa-motorcycle"></i> Status: ${order.status.toUpperCase()}</p>
                        <p class="text-xs text-zinc-300">Driver sedang dalam proses penjemputan/perjalanan.</p>
                        <button onclick="cancelOrder()" class="bg-red-500/20 text-red-400 text-xs font-bold px-3 py-1.5 rounded-xl mt-2">Batalkan</button>
                    </div>`;
            }
        } else {
            // Mode Driver
            title.innerText = "Mode Pengemudi (Online)";
            if (!order || order.status === 'idle') {
                card.innerHTML = `
                    <div class="text-center py-8 space-y-2">
                        <i class="fa-solid fa-radar animate-spin text-[#c6ff00] text-3xl mb-2"></i>
                        <p class="text-xs text-zinc-400">Radar Aktif: Menunggu orderan masuk...</p>
                    </div>`;
            } else if (order.status === 'searching') {
                triggerVibration('near');
                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-700 space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-xs text-zinc-400">Orderan Masuk Realtime</span>
                                <span class="text-sm font-bold text-[#c6ff00]">Rp ${order.price.toLocaleString('id-ID')}</span>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-white">${pickupAddress}</p>
                                <p class="text-[10px] text-zinc-400">Tujuan: ${destAddress}</p>
                            </div>
                            <button onclick="driverSendOffer()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs shadow-lg">Kirim Tawaran / Terima Order</button>
                        </div>
                    </div>`;
            } else if (order.status === 'driver_offered') {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 text-center space-y-2">
                        <i class="fa-solid fa-spinner animate-spin text-[#c6ff00] text-xl"></i>
                        <p class="text-xs font-bold text-white">Menunggu Konfirmasi Penumpang...</p>
                    </div>`;
            } else if (order.status === 'accepted') {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 space-y-3">
                        <h4 class="font-bold text-sm text-[#c6ff00]"><i class="fa-solid fa-route mr-1"></i> Menuju Titik Jemput</h4>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${pickupCoords[0]},${pickupCoords[1]}&travelmode=driving" target="_blank" class="block w-full text-center bg-blue-600 text-white font-bold py-3 rounded-xl text-xs">Navigasi Google Maps (Rute Jemput)</a>
                        <button onclick="driverArrived()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs">Saya Sudah Tiba di Titik Jemput</button>
                    </div>`;
            } else if (order.status === 'arrived') {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 space-y-3 text-center">
                        <p class="text-xs text-yellow-400 font-bold"><i class="fa-solid fa-bell"></i> Notifikasi terkirim ke penumpang!</p>
                        <button onclick="driverStartDelivering()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs">Mulai Perjalanan ke Tujuan</button>
                    </div>`;
            } else if (order.status === 'delivering') {
                card.innerHTML = `
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-800 space-y-3">
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${destCoords[0]},${destCoords[1]}&travelmode=driving" target="_blank" class="block w-full text-center bg-blue-600 text-white font-bold py-3 rounded-xl text-xs">Navigasi ke Titik Tujuan</a>
                        <button onclick="driverFinishOrder()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs">Perjalanan Selesai</button>
                    </div>`;
            }
        }
    }

    function passengerPublishOrder() {
        db.ref('active_order').set({
            price: currentBidPrice,
            pickup: pickupCoords,
            destination: destCoords,
            status: 'searching'
        });
    }

    function cancelOrder() {
        db.ref('active_order').set({ status: 'idle' });
    }

    function driverSendOffer() {
        triggerVibration('accept');
        db.ref('active_order/status').set('driver_offered');
    }

    function passengerAcceptDriver() {
        triggerVibration('accept');
        db.ref('active_order/status').set('accepted');
    }

    function driverArrived() {
        triggerVibration('near');
        db.ref('active_order/status').set('arrived');
    }

    function driverStartDelivering() {
        db.ref('active_order/status').set('delivering');
    }

    function driverFinishOrder() {
        triggerVibration('accept');
        const newTrip = {
            id: 'TRIP-' + Math.floor(1000 + Math.random() * 9000),
            date: new Date().toLocaleString('id-ID'),
            service: 'inMotor - Perjalanan Kota',
            fare: currentBidPrice,
            route: `${pickupAddress} -> ${destAddress}`
        };
        historyTrips.unshift(newTrip);
        localStorage.setItem('indrive_history', JSON.stringify(historyTrips));

        db.ref('active_order').set({ status: 'idle' });
        alert("Perjalanan Selesai!");
    }

    function openHistoryModal() {
        const listContent = document.getElementById('history-list-content');
        listContent.innerHTML = '';
        if (historyTrips.length === 0) {
            listContent.innerHTML = `<p class="text-xs text-zinc-500 text-center py-6">Tidak ada riwayat.</p>`;
        } else {
            historyTrips.forEach(trip => {
                listContent.innerHTML += `
                    <div class="bg-[#121416] p-3.5 rounded-2xl border border-zinc-800 space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xs text-white">${trip.service}</span>
                            <span class="font-bold text-xs text-[#c6ff00]">Rp ${trip.fare.toLocaleString('id-ID')}</span>
                        </div>
                        <p class="text-[10px] text-zinc-400">${trip.date}</p>
                        <p class="text-[10px] text-zinc-300">${trip.route}</p>
                    </div>`;
            });
        }
        document.getElementById('history-modal').classList.remove('hidden');
    }

    document.getElementById('menu-btn').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('-translate-x-full');
        document.getElementById('backdrop').classList.remove('hidden');
    });
    document.getElementById('backdrop').addEventListener('click', () => {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('backdrop').classList.add('hidden');
    });

    updateRoleButtons();
</script>
</body>
</html>
