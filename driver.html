<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>inDriver - Driver Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body, html { height: 100%; margin: 0; background-color: #121212; color: #ffffff; font-family: system-ui, sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 0; }
        .app-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>
<div class="app-shell justify-between">
    <header class="interactive m-3 flex justify-between items-center p-3.5 bg-[#181a1c]/95 backdrop-blur-md rounded-2xl border border-zinc-800 shadow-xl">
        <button id="menu-btn" class="text-white text-lg p-2"><i class="fa-solid fa-bars"></i></button>
        <span class="text-xs font-bold text-[#c6ff00] uppercase tracking-wider">MODE PENGEMUDI (ONLINE)</span>
        <a href="index.html" target="_blank" class="text-[10px] bg-blue-600 text-white font-bold px-2.5 py-1.5 rounded-lg">Buka Penumpang</a>
    </header>

    <div class="interactive bg-[#16181a]/95 backdrop-blur-2xl border-t border-zinc-800 rounded-t-3xl p-5 shadow-2xl" id="ui-card">
        <!-- Card Radar Driver -->
    </div>
</div>

<div id="map"></div>

<script>
    const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "YOUR_AUTH_DOMAIN", databaseURL: "https://YOUR_DATABASE-default-rtdb.firebaseio.com", projectId: "YOUR_PROJECT_ID" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const map = L.map('map', { zoomControl: false }).setView([-7.0337, 107.5833], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

    db.ref('active_order').on('value', (snapshot) => {
        renderDriverUI(snapshot.val());
    });

    function renderDriverUI(order) {
        const card = document.getElementById('ui-card');
        if (!order || order.status === 'idle') {
            card.innerHTML = `
                <div class="text-center py-6 space-y-2">
                    <i class="fa-solid fa-radar animate-spin text-[#c6ff00] text-3xl"></i>
                    <p class="text-xs text-zinc-400">Radar Aktif: Mencari order di sekitar...</p>
                </div>`;
        } else if (order.status === 'searching') {
            card.innerHTML = `
                <div class="space-y-3">
                    <div class="bg-[#212325] p-4 rounded-2xl border border-zinc-700 space-y-3">
                        <div class="flex justify-between items-center"><span class="text-xs text-zinc-400">Orderan Masuk Realtime</span><span class="text-sm font-bold text-[#c6ff00]">Rp ${order.price.toLocaleString('id-ID')}</span></div>
                        <p class="text-xs font-bold text-white">Jl. Desa Tarajusari -> PT Weharima</p>
                        <button onclick="sendOffer()" class="w-full bg-[#c6ff00] text-black font-bold py-3 rounded-xl text-xs shadow-lg">Kirim Tawaran / Terima Order</button>
                    </div>
                </div>`;
        } else if (order.status === 'driver_offered') {
            card.innerHTML = `<div class="text-center py-4"><i class="fa-solid fa-spinner animate-spin text-[#c6ff00] text-xl"></i><p class="text-xs text-white mt-2">Menunggu konfirmasi penumpang...</p></div>`;
        } else if (order.status === 'accepted') {
            card.innerHTML = `<div class="bg-[#212325] p-4 rounded-xl text-center space-y-2"><p class="text-xs text-[#c6ff00] font-bold">Orderan Diterima Penumpang!</p><a href="https://www.google.com/maps/dir/?api=1&destination=-7.0337,107.5833&travelmode=driving" target="_blank" class="block w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Navigasi Google Maps</a></div>`;
        }
    }

    function sendOffer() { db.ref('active_order/status').set('driver_offered'); }
</script>
</body>
</html>
